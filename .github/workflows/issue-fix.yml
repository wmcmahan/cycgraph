# Issue fix: the cycle over approved upkeep issues. core-upkeep files
# what the codebase owes; a human approves an issue by labelling it
# `maintenance-approved`; this workflow fixes one per run and opens a PR
# that closes it. The judge refuses erasure — a TODO deleted without the
# work, a test deleted instead of un-skipped, a warning silenced with
# eslint-disable — so a run only delivers work that was actually done.
# With nothing approved, the run exits clean in minutes.
#
# Secrets: ANTHROPIC_API_KEY (fixer model), MAINTENANCE_PAT (push + PR;
# see docs-maintenance.yml for why the built-in token is a weak fallback).

name: Issue fix

on:
  schedule:
    - cron: '0 10 * * 2'
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: issue-fix-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  fix:
    # A label event only counts when the label is the approval itself —
    # approving an issue starts its fix immediately instead of waiting
    # for the weekly sweep.
    if: github.event_name != 'issues' || github.event.label.name == 'maintenance-approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=packages/orchestrator --workspace=packages/memory --workspace=packages/tools

      - name: Fix one approved upkeep issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
          CYCGRAPH_MODEL: ${{ vars.CYCGRAPH_MODEL || 'claude-opus-5' }}
          GIT_AUTHOR_NAME: cycgraph-maintenance
          GIT_AUTHOR_EMAIL: maintenance@cycgraph.local
        run: npm run maintain --workspace=ops/maintenance -- issue-fix --checks "npm run lint:eslint" --issueNumber ${{ github.event.issue.number || 0 }}
