# Issue fix: the serialized dispatcher over approved upkeep issues.
#
# GitHub is the queue: open issues carrying `maintenance-approved`
# (applied by a human, or filed pre-approved by the audit and upkeep
# workflows running with --approve). The picker takes the worst
# `severity:*` label first, oldest within, and the pipeline holds ONE
# fix in flight end-to-end — no run starts while any maintenance-managed
# PR is open, so every fix branches from a main that already contains
# the previous one and merge conflicts have nothing to feed on.
#
# The chain: approval label -> fix PR -> pr-review (approve arms
# auto-merge; revise dispatches pr-revise) -> merge closes the issue ->
# the merge event fires this workflow again for the next pick. There
# is no cron: a dropped event is recovered by a manual dispatch. The judge still refuses
# erasure, so a run only delivers work that was actually done; with
# nothing approved, the run exits clean in minutes.
#
# Secrets: ANTHROPIC_API_KEY (fixer model), MAINTENANCE_PAT (push + PR;
# see docs-maintenance.yml for why the built-in token is a weak fallback).

name: Issue fix

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

# One constant group: runs queue behind each other instead of
# interleaving, which is the one-fix-at-a-time guarantee.
concurrency:
  group: issue-fix-pipeline
  cancel-in-progress: false

jobs:
  fix:
    # Fire on: a manual dispatch, the cron sweep, the approval label
    # itself (an approved issue starts immediately), or a merged
    # maintenance PR (the previous fix landing is what frees the
    # pipeline for the next pick).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' && github.event.label.name == 'maintenance-approved') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'maintenance-managed'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      # One fix in flight: while any maintenance PR is open, this tick
      # yields — the PR's own merge event runs the next pick.
      - name: Check the pipeline is idle
        id: gate
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
        run: |
          blockers=$(gh pr list --label maintenance-managed --state open --json number,labels \
            --jq '[.[] | "#\(.number)\(if any(.labels[]; .name == "needs-human") then " (needs-human)" else "" end)"] | join(", ")')
          if [ -z "$blockers" ]; then
            echo "idle=true" >> "$GITHUB_OUTPUT"
          else
            echo "idle=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pipeline waiting on open maintenance PR(s): $blockers — a needs-human PR only moves when you review, merge, or close it."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.idle == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.idle == 'true'

      # The full build, not a subset: the workspace checks run every
      # package's tests, and any unbuilt @cycgraph/* dist fails suite
      # resolution — a gate that can never pass.
      - run: npm run build
        if: steps.gate.outputs.idle == 'true'

      - name: Fix the highest-priority approved issue
        if: steps.gate.outputs.idle == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
          CYCGRAPH_MODEL: ${{ vars.CYCGRAPH_MODEL || 'claude-opus-5' }}
          GIT_AUTHOR_NAME: cycgraph-maintenance
          GIT_AUTHOR_EMAIL: maintenance@cycgraph.local
        run: npm run maintain --workspace=ops/maintenance -- issue-fix --checks "npm run lint:eslint,npm test" --issueNumber ${{ github.event.issue.number || 0 }}
