# Optimization apply: implement one approved optimization ticket. The
# ticket carries a verified diff, so no model is involved: re-apply,
# re-benchmark, and only an improvement that still holds — with the
# orchestrator's test suite green — becomes the PR that closes it.

name: Optimization apply

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: optimization-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      # One fix in flight across the whole pipeline: while any maintenance
      # PR is open (from issue-fix, implement-ticket, or here), this dispatch
      # yields rather than opening a second managed PR that would race to
      # merge. Shares the invariant issue-fix enforces.
      - name: Check the pipeline is idle
        id: gate
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
        run: |
          blockers=$(gh pr list --label maintenance-managed --state open --json number,labels \
            --jq '[.[] | "#\(.number)\(if any(.labels[]; .name == "needs-human") then " (needs-human)" else "" end)"] | join(", ")')
          if [ -z "$blockers" ]; then
            echo "idle=true" >> "$GITHUB_OUTPUT"
          else
            echo "idle=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pipeline waiting on open maintenance PR(s): $blockers — optimization-apply yields until they are merged, closed, or reviewed."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.idle == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.idle == 'true'

      - run: npm run build --workspace=packages/orchestrator --workspace=packages/memory --workspace=packages/tools --workspace=packages/orchestrator-postgres
        if: steps.gate.outputs.idle == 'true'

      - name: Apply one approved optimization
        if: steps.gate.outputs.idle == 'true'
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GIT_AUTHOR_NAME: cycgraph-maintenance
          GIT_AUTHOR_EMAIL: maintenance@cycgraph.local
        run: >
          npm run maintain --workspace=ops/maintenance -- optimization-apply
          --checks "npm run build:libs,npm run lint:eslint,npm test"
