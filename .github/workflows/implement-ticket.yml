# Apply ticket: implement one approved feature ticket. The ticket is
# the spec, its runnable acceptance criteria are the judge, and the PR it
# opens — closing the ticket — is where the human verdict happens.

name: Implement ticket

on:
  workflow_dispatch:
    inputs:
      issueNumber:
        description: 'Implement this specific ticket (0 picks the oldest approved)'
        default: '0'

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: implement-ticket
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      # One fix in flight across the whole pipeline: while any maintenance
      # PR is open (from issue-fix, optimization-apply, or here), this dispatch
      # yields rather than opening a second managed PR that would race to
      # merge. Shares the invariant issue-fix enforces.
      - name: Check the pipeline is idle
        id: gate
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
        run: |
          blockers=$(gh pr list --label maintenance-managed --state open --json number,labels \
            --jq '[.[] | "#\(.number)\(if any(.labels[]; .name == "needs-human") then " (needs-human)" else "" end)"] | join(", ")')
          if [ -z "$blockers" ]; then
            echo "idle=true" >> "$GITHUB_OUTPUT"
          else
            echo "idle=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pipeline waiting on open maintenance PR(s): $blockers — implement-ticket yields until they are merged, closed, or reviewed."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.idle == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.idle == 'true'

      - run: npm run build --workspace=packages/orchestrator --workspace=packages/memory --workspace=packages/context-engine --workspace=packages/tools --workspace=packages/a2a --workspace=packages/orchestrator-postgres --workspace=packages/evals
        if: steps.gate.outputs.idle == 'true'

      - name: Implement one approved feature
        if: steps.gate.outputs.idle == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
          CYCGRAPH_MODEL: ${{ vars.CYCGRAPH_MODEL || 'claude-opus-5' }}
          CYCGRAPH_MODEL_HIGH: ${{ vars.CYCGRAPH_MODEL_HIGH }}
          CYCGRAPH_MODEL_MEDIUM: ${{ vars.CYCGRAPH_MODEL_MEDIUM }}
          CYCGRAPH_MODEL_LOW: ${{ vars.CYCGRAPH_MODEL_LOW }}
          GIT_AUTHOR_NAME: cycgraph-maintenance
          GIT_AUTHOR_EMAIL: maintenance@cycgraph.local
        run: >
          npm run maintain --workspace=ops/maintenance -- implement-ticket
          --issueNumber ${{ inputs.issueNumber || 0 }}
          --checks "npm run build:libs,npm run lint:eslint,npm test"
