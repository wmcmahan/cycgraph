# Repo audit: model-driven discovery, weekly.
#
# The nightly docs/core scanners catch what a detector can name; this run
# fans out read-only auditors over lens × package charters and files the
# evidence-checked shortlist as tickets. Nothing is edited and nothing
# merges: each ticket waits for the `maintenance-approved` label, and the
# fix rides the issue-fix ladder like any other approved issue.
#
# With DATABASE_URL set the sweep joins the patrol's scheduler: its
# twelve Opus slots go to the stalest lens × scope pairs, complementing
# the patrol's frequent changed-first passes. Without it, runs take the
# same diagonal slice each week.
#
# Secrets and variables: as docs-maintenance (ANTHROPIC_API_KEY required,
# MAINTENANCE_PAT recommended so tickets come from a real actor,
# CYCGRAPH_MODEL optional override), plus DATABASE_URL (recommended) for
# scheduler state and the lesson loop.

name: Repo audit

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      focus:
        description: Steer every charter toward an area or concern
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: repo-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=packages/orchestrator --workspace=packages/memory --workspace=packages/tools --workspace=packages/orchestrator-postgres

      - name: Run repo audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CYCGRAPH_MODEL: ${{ vars.CYCGRAPH_MODEL || 'claude-opus-5' }}
          GIT_AUTHOR_NAME: cycgraph-maintenance
          GIT_AUTHOR_EMAIL: maintenance@cycgraph.local
        run: >
          npm run maintain --workspace=ops/maintenance --
          repo-audit
          ${{ github.event.inputs.focus != '' && format('--focus "{0}"', github.event.inputs.focus) || '' }}
