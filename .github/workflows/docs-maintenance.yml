# Docs maintenance: the self-maintaining documentation loop, promoted to CI.
#
# Two triggers, one workflow (ops/maintenance):
#   - Nightly (and manual dispatch): full scan of each docs scope, batched —
#     up to 3 verified fixes per run, one branch, one PR.
#   - Push to main: diff mode — only findings the pushed change plausibly
#     staled are taken, so a docs-breaking change gets a fix PR the same day.
#
# Secrets and variables:
#   ANTHROPIC_API_KEY (secret, required) — the fixer model.
#   MAINTENANCE_PAT (secret, recommended) — a fine-grained PAT with contents
#     + pull-requests write. PRs created with the built-in GITHUB_TOKEN do
#     not trigger CI, so without the PAT the maintenance PRs arrive with no
#     checks. The PAT is used for both the checkout (push auth) and `gh`.
#   CYCGRAPH_MODEL (variable, optional) — overrides the fixer model.
#
# The run itself never merges anything: each PR waits for a human, and the
# scan defers findings any open docs/* PR already touches.

name: Docs maintenance

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-maintenance
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        workflow: [repo-docs, website-docs]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the workspace clone and diff mode both need it.
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only what ops/maintenance imports; the full root build drags in the
      # studio's site build, which a docs run has no use for.
      - run: npm run build --workspace=packages/orchestrator --workspace=packages/memory --workspace=packages/tools

      - name: Run docs maintenance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
          CYCGRAPH_MODEL: ${{ vars.CYCGRAPH_MODEL || 'claude-opus-5' }}
          GIT_AUTHOR_NAME: cycgraph-maintenance
          GIT_AUTHOR_EMAIL: maintenance@cycgraph.local
        run: >
          npm run maintain --workspace=ops/maintenance --
          ${{ matrix.workflow }}
          ${{ github.event_name == 'push'
              && format('--since {0} --batch 2', github.event.before)
              || '--batch 3' }}
        # A force-push or branch creation has no usable before-SHA; the
        # nightly full scan covers whatever a skipped diff run would have.
        if: github.event_name != 'push' || (github.event.before != '0000000000000000000000000000000000000000' && !github.event.forced)
