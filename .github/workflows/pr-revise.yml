# PR revise: human review feedback, closed as a loop. A reviewer
# requesting changes on a maintenance PR — or any comment mentioning
# @cycgraph on one — dispatches a run that reads the feedback, revises
# the same branch (updating the PR in place), and replies. The human
# verdict still ends every thread: this never opens or merges anything.

name: PR revise

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to revise'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-revise-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  revise:
    # Fire only for: change-requesting reviews on our maintenance branches,
    # explicit @cycgraph comments on PRs, or a manual dispatch. Never for
    # the workflow identity's own comments.
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'changes_requested' &&
       (startsWith(github.event.pull_request.head.ref, 'docs/') ||
        startsWith(github.event.pull_request.head.ref, 'feat/impl-') ||
        startsWith(github.event.pull_request.head.ref, 'upkeep/') ||
        startsWith(github.event.pull_request.head.ref, 'opt/'))) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@cycgraph'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=packages/orchestrator --workspace=packages/memory --workspace=packages/context-engine --workspace=packages/tools --workspace=packages/a2a --workspace=packages/orchestrator-postgres --workspace=packages/evals

      - name: Address the review feedback
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
          CYCGRAPH_MODEL: ${{ vars.CYCGRAPH_MODEL || 'claude-opus-5' }}
          GIT_AUTHOR_NAME: cycgraph-maintenance
          GIT_AUTHOR_EMAIL: maintenance@cycgraph.local
        run: >
          npm run maintain --workspace=ops/maintenance -- pr-revise
          --pr ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          --checks "npm run lint:eslint"
