# PR revise: review feedback, closed as a loop. On a PR carrying the
# maintenance-managed label (applied to bot PRs at birth; by hand to any
# PR the loop should manage — GitHub restricts labeling to triage+
# users, which is the consent check), a change-requesting review, a
# review whose body mentions @cycgraph (pr-review's handoff — its
# verdict submits as a comment-state review, since a token cannot
# request changes on its own PR), or a
# comment mentioning @cycgraph dispatches a run that reads the feedback,
# revises the same branch (updating the PR in place), and replies. The
# revision push then fires pr-review's verification pass over the prior
# findings. The human verdict still ends every thread: this never opens
# or merges anything. The label name is a literal here — keep it in sync with
# MANAGED_LABEL in ops/maintenance/src/repo.ts.

name: PR revise

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to revise'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-revise-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  revise:
    # Fire only for: a manual dispatch, or — on a PR carrying the
    # maintenance-managed label — a change-requesting review, or an
    # @cycgraph comment from an OWNER/MEMBER/COLLABORATOR (commenting
    # needs no permission, so association is the trust check). The workflow identity's comments trigger this
    # only when they carry the mention deliberately (pr-review's
    # handoff); every relayed reply strips mentions, so nothing echoes.
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'changes_requested' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
       contains(github.event.pull_request.labels.*.name, 'maintenance-managed')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@cycgraph') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
       contains(github.event.pull_request.labels.*.name, 'maintenance-managed')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.issue.labels.*.name, 'maintenance-managed') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(github.event.comment.body, '@cycgraph')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.pull_request.labels.*.name, 'maintenance-managed') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(github.event.comment.body, '@cycgraph'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The full build, not a subset: the workspace checks run every
      # package's tests, and any unbuilt @cycgraph/* dist fails suite
      # resolution — a gate that can never pass.
      - run: npm run build

      - name: Address the review feedback
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
          CYCGRAPH_MODEL: ${{ vars.CYCGRAPH_MODEL || 'claude-opus-5' }}
          GIT_AUTHOR_NAME: cycgraph-maintenance
          GIT_AUTHOR_EMAIL: maintenance@cycgraph.local
          # The reviser carries review threads plus checks evidence; the
          # engine's 50KB memory default truncates that mid-loop.
          MAX_MEMORY_PROMPT_BYTES: 204800
        run: >
          npm run maintain --workspace=ops/maintenance -- pr-revise
          --pr ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          --checks "npm run build:libs,npm run lint:eslint,npm test"

      # A failed run must not be silent on the PR it was working: the
      # comment names the run so the log is one click away.
      - name: Leave a failure trace on the PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
        run: |
          pr=${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          gh label create needs-human 2>/dev/null || true
          gh pr edit "$pr" --add-label needs-human || true
          gh pr comment "$pr" --body "pr-revise ran but failed before delivering a revision — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} for the log. This PR now carries the needs-human label; the findings above still stand, and a later successful revision clears it."
