# PR review: a first-pass advisory code review on every opened PR.
#
# The reviewer reads the branch diff beside a checkout of the PR branch,
# verifies findings against the tree (duplication, convention drift,
# hollow tests), and submits one real review: findings anchored inline
# on the diff, APPROVE when clean (degraded to a comment-state review on
# the token's own PRs, which GitHub forbids it approving). On a REVISE
# verdict against a PR carrying the maintenance-managed label (bot PRs
# are labeled at creation; label your own to opt in), the review body
# ends with the @cycgraph trigger, so pr-revise addresses the findings
# in the same cycle (needs MAINTENANCE_PAT — the Actions token's
# reviews fire no workflows). Unlabeled PRs get findings only. The
# human merge stays the gate.
# A push to a LABELED PR re-runs the review as a verification pass: the
# reviewer checks each prior finding (ADDRESSED/UNRESOLVED) before
# judging what changed, bounded at three reviews per PR. Unlabeled PRs
# are reviewed once on open; dispatch manually for a re-review.
#
# Secrets and variables: as the other maintenance workflows
# (ANTHROPIC_API_KEY required; MAINTENANCE_PAT and DATABASE_URL
# recommended — the latter records the run and feeds the lesson loop).

name: PR review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    # Every non-draft PR is reviewed on open. Pushes re-review only
    # labeled PRs — that is the verification pass over a revision (the
    # bot pushes via the PAT, so its push fires this) — bounded by the
    # rounds cap inside the workflow.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       (github.event.action != 'synchronize' ||
        contains(github.event.pull_request.labels.*.name, 'maintenance-managed')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=packages/orchestrator --workspace=packages/memory --workspace=packages/tools --workspace=packages/orchestrator-postgres

      - name: Run PR review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # REVIEW_PAT (optional): a second account's token. GitHub
          # forbids a token approving its own PR, so reviews of
          # MAINTENANCE_PAT-authored PRs only get the green Approved
          # state when they are submitted by a different account;
          # without it they degrade to comment-state reviews.
          GH_TOKEN: ${{ secrets.REVIEW_PAT || secrets.MAINTENANCE_PAT || github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CYCGRAPH_MODEL: ${{ vars.CYCGRAPH_MODEL || 'claude-opus-5' }}
        run: >
          npm run maintain --workspace=ops/maintenance --
          pr-review
          --pr ${{ github.event.pull_request.number || inputs.pr }}
