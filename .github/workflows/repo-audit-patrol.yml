# Audit patrol: the frequent, budget-capped mode of repo-audit.
#
# Four auditor slots per run, three runs a day: scopes changed since the
# last audited commit take slots first, and the rest of the lens × scope
# cross-product fills oldest-audited-first — a scheduler, not a filter,
# so nothing is ever memoized away and stable code keeps getting fresh
# eyes on a bounded cycle. The Monday full sweep (repo-audit.yml) stays
# the everything-at-once backstop.
#
# Secrets and variables: as repo-audit, plus DATABASE_URL (recommended)
# — the scheduler's last-audited state and the lesson loop both live in
# it. Without it each run degrades to the stateless diagonal order, so
# consecutive runs re-audit the same slice; the sweep still covers
# everything weekly.
#
# CYCGRAPH_PATROL_MODEL (variable, optional) picks the patrol model
# independently of the sweep; the default leans cheap since the sweep
# carries the deep Opus pass.

name: Repo audit patrol

on:
  schedule:
    - cron: '0 13,17,21 * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: Steer every charter toward an area or concern
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: repo-audit
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=packages/orchestrator --workspace=packages/memory --workspace=packages/tools --workspace=packages/orchestrator-postgres

      - name: Run audit patrol
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CYCGRAPH_MODEL: ${{ vars.CYCGRAPH_PATROL_MODEL || 'claude-sonnet-5' }}
          GIT_AUTHOR_NAME: cycgraph-maintenance
          GIT_AUTHOR_EMAIL: maintenance@cycgraph.local
        run: >
          npm run maintain --workspace=ops/maintenance --
          repo-audit
          --maxAuditors 4
          --budgetTokens 2000000
          ${{ github.event.inputs.focus != '' && format('--focus "{0}"', github.event.inputs.focus) || '' }}
