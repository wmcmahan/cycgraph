# Pipeline reconciler: the between-run backstop.
#
# The maintenance pipeline is a single-token state machine advanced by one
# GitHub event per hop (a merge fires the next pick; a check suite fires
# the CI reaction). If an event is dropped, or a run dies between the gate
# check and the pick, or an armed auto-merge never lands, the pipeline
# goes idle-but-asleep with no needs-human and no recovery — the "relies
# on GitHub never dropping an event" gap. This runs on a clock and
# reasserts the two invariants that keep it moving:
#
#   1. Wake the queue. If no maintenance-managed PR is open (the one-fix
#      gate is idle) and an issue-fix-fixable approved issue is waiting,
#      dispatch issue-fix. issue-fix's own idle gate + concurrency group
#      make a redundant dispatch a safe no-op. Only issue-fix is woken;
#      implement-ticket and optimization-apply stay manual by design, so approved
#      feature/optimization/tune tickets are excluded from the wake.
#
#   2. Surface a wedged token. Any managed PR with no activity for over
#      four hours — checks stuck, auto-merge unable to complete, or a
#      closure/creation that stranded it — is flagged needs-human, making
#      the block visible and freeing the one-fix slot for a human to
#      clear. Flag, never auto-recover: a human decides.
#
# The finding-marker prefix and label names are this repository's literals
# (kept in sync with ops/maintenance/src/shared/repo.ts and the finding
# markers in @cycgraph/tools). Read-mostly; at most one dispatch and a few
# label writes per tick.
#
# Secrets: MAINTENANCE_PAT — needs actions:write to dispatch issue-fix and
# issues/PR write to flag; the built-in token also works for the queries.

name: Reconcile pipeline

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: reconcile-pipeline
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reassert the pipeline invariants
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT || github.token }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Wake the queue when the gate is idle and fixable work waits.
          open_managed=$(gh pr list -R "$REPO" --label maintenance-managed --state open --json number --jq 'length')
          if [ "$open_managed" -eq 0 ]; then
            # An issue-fix-fixable issue: approved, not parked on needs-human,
            # and carrying a finding marker whose kind is not one of the
            # manually-dispatched ladders (feature/optimization/tune).
            fixable=$(gh issue list -R "$REPO" --state open --label maintenance-approved --json number,body,labels \
              --jq '[.[] | select(([.labels[].name] | index("needs-human") | not) and ((.body // "") | test("cycgraph:finding=(?!(feature|optimization|tune):)"))) ] | length')
            if [ "$fixable" -gt 0 ]; then
              echo "gate idle with $fixable fixable approved issue(s) queued — dispatching issue-fix"
              gh workflow run issue-fix.yml -R "$REPO" || echo "::warning::could not dispatch issue-fix"
            else
              echo "gate idle, no fixable approved work — nothing to wake"
            fi
          else
            echo "$open_managed managed PR(s) open — pipeline busy, not waking the queue"
          fi

          # 2. Flag a managed PR wedged with no activity for over four hours.
          stale_before=$(date -u -d '4 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          stale=$(gh pr list -R "$REPO" --label maintenance-managed --state open --json number,updatedAt,labels \
            --jq "[.[] | select(([.labels[].name] | index(\"needs-human\") | not) and (.updatedAt < \"$stale_before\")) | .number] | .[]")
          for pr in $stale; do
            echo "PR #$pr has had no activity since before $stale_before — flagging needs-human"
            gh label create needs-human -R "$REPO" 2>/dev/null || true
            gh pr edit -R "$REPO" "$pr" --add-label needs-human || true
            gh pr comment -R "$REPO" "$pr" --body "Something went wrong and this maintenance PR has stopped making progress, so it now carries the \`needs-human\` label. Review, merge, or close it, or remove the label to let the loop retry."
          done
