services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/orchestrator-postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318" # OTLP HTTP receiver
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scenario-servers:
    build:
      context: ./packages/test-servers
    ports:
      - "${A2A_PORT:-4001}:4001"
      - "${MCP_PORT:-4002}:4002"
    environment:
      TEST_SERVER_HOST: 0.0.0.0
      A2A_PUBLIC_URL: ${A2A_PUBLIC_URL:-http://127.0.0.1:4001}
      OLLAMA_BASE_URL: ${TEST_SERVER_OLLAMA_URL:-http://host.docker.internal:11434}
      A2A_AGENT_MODEL: ${CYCGRAPH_MODEL:-qwen2.5:7b}
    volumes:
      - ./packages/test-servers/src:/app/src
    restart: unless-stopped
    profiles:
      - playground
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-admin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@flattop.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    restart: unless-stopped
    profiles:
      - tools

volumes:
  postgres_data:
